syntax = "proto3";

package inventory;

option go_package = "github.com/raflynagachi/go-rest-api-starter/gen/inventory;inventorypb";

service InventoryService {
  // CheckStock returns whether the requested quantity is available.
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
  // Reserve atomically decrements the stock for a given SKU.
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
}

message CheckStockRequest {
  string sku      = 1;
  int64  quantity = 2;
}

message CheckStockResponse {
  bool    available = 1;
  double  price     = 2;
  int64   in_stock  = 3;
}

message ReserveRequest {
  string sku      = 1;
  int64  quantity = 2;
  int64  order_id = 3;
}

message ReserveResponse {
  bool   success    = 1;
  string message    = 2;
}
